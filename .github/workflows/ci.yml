name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        timeout-minutes: 5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify module files and checksums
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
        timeout-minutes: 5

      - name: Run go vet
        run: go vet ./...
        timeout-minutes: 5

      - name: Run tests
        run: go test -v -race ./...
        timeout-minutes: 10

      - name: Build
        run: go build ./...
        timeout-minutes: 5
